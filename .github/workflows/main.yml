name: Build DocStat Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp app.html www/index.html 2>/dev/null || cp index.html www/index.html
          cp *.js www/ 2>/dev/null || true
          cp *.png www/ 2>/dev/null || true

      - name: Check web assets
        run: |
          test -f www/index.html || { echo "Missing www/index.html"; exit 1; }

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Add Android platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Restore Keystore from Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks

      - name: Auto-Increment Version Code
        run: |
          sed -i 's/versionCode 1/versionCode ${{ github.run_number }}/g' android/app/build.gradle || true

      - name: Sign and Build Android Release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=release.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEYSTORE_PASSWORD \
            --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DocCalc-v${{ github.run_number }}-APK
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn

      - name: Fallback Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DocStat-v${{ github.run_number }}-Signed-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
